# SonarCloud project config
# Docs: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/

sonar.projectKey=Mhdomer_devsecops-pipeline
sonar.organization=mhdomer

# Analyse the whole repo, not just app/: SonarCloud also has rules for the Dockerfile,
# GitHub Actions workflows, shell scripts and Terraform, and those are part of the
# attack surface too.
sonar.sources=.
sonar.exclusions=app/tests/**,tests/**,docs/**,learning/**,.venv/**,zap-out/**,terraform/.terraform/**,coverage.xml

# Tests. tests/gates/ also holds deliberately broken fixtures (vulnerable Dockerfile,
# planted-issue patches); only its Python tests are indexed.
sonar.tests=.
sonar.test.inclusions=app/tests/**/*.py,tests/gates/**/*.py

# Python version
sonar.python.version=3.11

# Coverage report (pytest --cov=app --cov=zap, generated in the pipeline)
sonar.python.coverage.reportPaths=coverage.xml

# Accepted findings. Each one is a deliberate choice, recorded here so it is reviewed
# like code instead of clicked away in the UI.
#  e1 docker:S8431    FROM uses tag AND digest: the digest pins the build, the tag lets
#                     Dependabot propose the next version. Digest-only would freeze it.
#  e2 terraform:S6329 Public IP on the EC2 instance: it is a public demo API with no load
#                     balancer or NAT (cost). Ingress is limited to the app port.
#  e3 python:S4502    "CSRF protection disabled": stateless JSON API, no cookies or
#                     sessions, so there is no ambient credential for CSRF to abuse.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e1.resourceKey=Dockerfile
sonar.issue.ignore.multicriteria.e2.ruleKey=terraform:S6329
sonar.issue.ignore.multicriteria.e2.resourceKey=terraform/ec2.tf
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.e3.resourceKey=app/app.py

# Encoding
sonar.sourceEncoding=UTF-8
