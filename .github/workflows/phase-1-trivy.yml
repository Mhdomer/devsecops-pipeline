name: "Phase 1 — Docker Build + Trivy Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-demo
  IMAGE_TAG: ${{ github.sha }}
  TRIVY_VERSION: v0.72.0

# Third-party and GitHub actions are pinned to a full commit SHA (tag in the comment).
# A tag can be moved to point at different code; a SHA cannot.

jobs:

  # ── 1. Unit tests ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  # ── 2. Build image ─────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Save image to tar
        run: docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ── 3. Trivy — SECURITY GATE ───────────────────────────────────────────────
  trivy-scan:
    name: "SECURITY GATE: Trivy"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Load image
        id: load
        run: docker load -i image.tar

      # Filesystem scan — reports HIGH/CRITICAL in requirements.txt (non-blocking)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: app/requirements.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

      # Image scan — BLOCKS pipeline on any CRITICAL CVE.
      # Table format on purpose: with format=sarif the action drops the severity
      # filter, so exit-code 1 would fire on LOW/MEDIUM/HIGH too. That is why the
      # May 2026 runs failed. Unfixed CVEs still block: an EOL base image is
      # mostly "will_not_fix" findings and must not slip through.
      - name: Trivy image scan (BLOCKING on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: "1"

      # Full report (all severities) for the GitHub Security tab. Never blocks.
      - name: Trivy image scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always() && steps.load.outcome == 'success'
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-sarif
          path: trivy-results.sarif

  # ── 4. Summary ─────────────────────────────────────────────────────────────
  phase-1-summary:
    name: Phase 1 Summary
    runs-on: ubuntu-latest
    needs: [test, build, trivy-scan]
    if: always()
    steps:
      - name: Gate result
        run: |
          {
            echo "## Phase 1 Gate Results"
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| Unit Tests | ${{ needs.test.result }} |"
            echo "| Docker Build | ${{ needs.build.result }} |"
            echo "| Trivy Scan | ${{ needs.trivy-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.trivy-scan.result }}" != "success" ]; then
            echo "**BLOCKED:** Trivy gate did not pass (CRITICAL CVEs, or an earlier job failed). Deploy prevented." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**PASSED:** All Phase 1 gates cleared." >> "$GITHUB_STEP_SUMMARY"
