name: "Phase 3 — OWASP ZAP DAST Gate"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No permissions by default; each job asks for exactly what it needs.
permissions: {}

env:
  IMAGE_NAME: devsecops-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ── 1. ZAP baseline — SECURITY GATE ───────────────────────────────────────
  # Runs the real image, then ZAP observes its responses (passive baseline scan).
  # Blocks on any High-risk alert or any rule marked FAIL in zap/zap-baseline.conf.
  # The scan + gate live in scripts/zap-scan.sh so CI and local runs are identical.
  zap-scan:
    name: "SECURITY GATE: OWASP ZAP"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Start app
        run: docker run -d --name app -p 5000:5000 "$IMAGE_NAME:$IMAGE_TAG"

      - name: Wait for app to be healthy
        run: |
          for _ in $(seq 1 30); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 1
          done
          echo "::error::App did not become healthy"
          docker logs app
          exit 1

      - name: ZAP baseline scan + gate (BLOCKING)
        env:
          TARGET: http://localhost:5000
          ZAP_NETWORK: host
          OUT_DIR: zap-out
        run: bash scripts/zap-scan.sh

      - name: Upload ZAP reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('zap-out/zap-report.html') != ''
        with:
          name: zap-report
          path: |
            zap-out/zap-report.html
            zap-out/zap-report.json

      - name: Stop app
        if: always()
        run: docker rm -f app || true

  # ── 2. Summary ─────────────────────────────────────────────────────────────
  phase-3-summary:
    name: Phase 3 Summary
    runs-on: ubuntu-latest
    needs: [zap-scan]
    if: always()
    permissions: {}
    env:
      ZAP_RESULT: ${{ needs.zap-scan.result }}
    steps:
      - name: Gate result
        run: |
          {
            echo "## Phase 3 Gate Results"
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| OWASP ZAP DAST | $ZAP_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$ZAP_RESULT" != "success" ]]; then
            echo "**BLOCKED:** ZAP found a High-risk alert or a FAIL-listed rule fired. Deploy prevented. See the zap-report artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**PASSED:** All Phase 3 gates cleared." >> "$GITHUB_STEP_SUMMARY"
