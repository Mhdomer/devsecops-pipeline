name: "Phase 2 — SonarQube SAST Gate"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ── 1. Unit tests + coverage ───────────────────────────────────────────────
  test-coverage:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

  # ── 2. SonarCloud SAST — SECURITY GATE ────────────────────────────────────
  sonarqube-scan:
    name: "SECURITY GATE: SonarQube SAST"
    runs-on: ubuntu-latest
    needs: test-coverage
    # Fork PRs get no secrets, so the scan could only fail. Pushes and same-repo PRs run it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # full history required for SonarCloud blame data

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report

      - name: Check SONAR_TOKEN is set
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Replaces the deprecated SonarSource/sonarcloud-github-action.
      # Project settings live in sonarqube/sonar-project.properties.
      # qualitygate.wait makes the scanner exit non-zero when the Quality Gate fails.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=sonarqube/sonar-project.properties
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ── 3. Summary ─────────────────────────────────────────────────────────────
  phase-2-summary:
    name: Phase 2 Summary
    runs-on: ubuntu-latest
    needs: [test-coverage, sonarqube-scan]
    if: always()
    steps:
      - name: Gate result
        run: |
          {
            echo "## Phase 2 Gate Results"
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| Unit Tests + Coverage | ${{ needs.test-coverage.result }} |"
            echo "| SonarQube SAST | ${{ needs.sonarqube-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.test-coverage.result }}" != "success" ] || [ "${{ needs.sonarqube-scan.result }}" == "failure" ]; then
            echo "**BLOCKED:** SonarQube Quality Gate failed. Deploy prevented." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ needs.sonarqube-scan.result }}" == "skipped" ]; then
            echo "**SKIPPED:** fork PR, no secrets. The gate runs again on merge to main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "**PASSED:** All Phase 2 gates cleared." >> "$GITHUB_STEP_SUMMARY"
