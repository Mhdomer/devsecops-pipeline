name: "Phase 4 — Terraform Checks + Deploy"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # the deploy job runs only from a manual dispatch

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-demo
  TF_VERSION: 1.15.8
  TRIVY_VERSION: v0.72.0

jobs:

  # ── 1. Terraform offline checks (no AWS credentials, mocked provider) ──────
  terraform-checks:
    name: Terraform fmt / validate / test / misconfig scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

      - name: terraform test (mock_provider, offline)
        run: terraform test

      - name: Trivy misconfiguration scan (BLOCKING on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ── 2. Deploy — DISABLED until the AWS account is funded ──────────────────
  # Turn on with: gh variable set AWS_DEPLOY_ENABLED --body true  (docs/aws-runbook.md)
  # Then run it from the Actions tab on main. It refuses to deploy a commit
  # unless the Trivy, SonarQube and ZAP workflows all passed for that commit.
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: terraform-checks
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && vars.AWS_DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read   # read gate results for this commit
      id-token: write # OIDC token for AWS, no stored keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Require all security gates passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in phase-1-trivy.yml phase-2-sonarqube.yml phase-3-zap.yml; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
            if [ "$n" -eq 0 ]; then
              echo "::error::$wf has no successful run for $GITHUB_SHA. Deploy blocked."
              exit 1
            fi
            echo "$wf passed for $GITHUB_SHA"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:

          persist-credentials: false

      - name: Build image
        run: docker build -t "$IMAGE_NAME:$GITHUB_SHA" .

      # The build runs apt-get upgrade, so this image can differ from the one
      # Phase 1 scanned. Re-run the same CRITICAL gate before it leaves the runner.
      - name: Trivy gate on the image being deployed (BLOCKING)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: "1"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Push image to ECR (tag = commit SHA, repo is immutable)
        run: |
          registry="${ECR_REPOSITORY_URL%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$ECR_REPOSITORY_URL:$GITHUB_SHA"
          docker push "$ECR_REPOSITORY_URL:$GITHUB_SHA"

      - name: Deploy on EC2 via SSM Run Command
        run: |
          cmd_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters "commands=[\"/usr/local/bin/deploy-app $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"
          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
          status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text)
          [ "$status" = "Success" ] || { echo "::error::Deploy command ended with status $status"; exit 1; }

      - name: Smoke test from outside
        run: |
          for _ in $(seq 1 20); do
            curl -fs "$APP_URL" && exit 0
            sleep 3
          done
          echo "::error::$APP_URL did not answer"
          exit 1
