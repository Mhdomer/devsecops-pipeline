# ZAP baseline rules: <rule id><TAB><action><TAB>(<name>)
# Actions: FAIL blocks the pipeline, WARN reports only, IGNORE hides.
# Rules not listed stay WARN. On top of this file, zap/zap_gate.py blocks on
# ANY alert ZAP rates High risk, whichever rule raised it.
#
# FAIL list = the response headers this API promises (app/app.py SECURITY_HEADERS)
# plus server software disclosure.
10020	FAIL	(Missing Anti-clickjacking Header)
10021	FAIL	(X-Content-Type-Options Header Missing)
10036	FAIL	(Server Leaks Version Information via "Server" HTTP Response Header Field)
10037	FAIL	(Server Leaks Information via "X-Powered-By" HTTP Response Header Field(s))
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
10055	FAIL	(CSP: Wildcard Directive / unsafe-inline / missing directives)
10063	FAIL	(Permissions Policy Header Not Set)
90004	FAIL	(Cross-Origin-Resource-Policy Header Missing or Invalid)
